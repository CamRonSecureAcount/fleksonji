name: "🍃 Linux Mint Dev VM"

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 🍃 DESKTOP + DEVELOPMENT PACKAGES
      # ============================================================
      - name: "📦 Install desktop + DEV ARSENAL"
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-core \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify \
            dbus-x11 \
            xterm \
            curl \
            wget \
            git \
            build-essential \
            gcc \
            g++ \
            make \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            openjdk-17-jdk \
            rustc \
            cargo \
            clang \
            lldb \
            gdb \
            vim \
            nano \
            zip \
            unzip \
            jq \
            htop \
            tree

          # ----------------------------------------------------------
          # ⚡ FASTFETCH
          # ----------------------------------------------------------
          if ! sudo apt-get install -y fastfetch; then
            wget -q \
              https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb \
              -O /tmp/fastfetch.deb

            sudo apt-get install -y /tmp/fastfetch.deb
          fi

          # ----------------------------------------------------------
          # 👤 USER
          # ----------------------------------------------------------
          sudo useradd -m -s /bin/bash mint || true
          echo "mint:mint" | sudo chpasswd
          sudo usermod -aG sudo mint

          sudo -u mint mkdir -p \
            /home/mint/Desktop \
            /home/mint/Downloads \
            /home/mint/Projects

          # Fastfetch whenever a terminal opens 😈
          cat <<'EOF' | sudo tee -a /home/mint/.bashrc

          # 🍃 Mint GitHub VM
          if command -v fastfetch >/dev/null 2>&1; then
              fastfetch
          fi
          EOF

          sudo chown -R mint:mint /home/mint

      # ============================================================
      # 🖥️ VNC CONFIGURATION
      # ============================================================
      - name: "🖥️ Configure VNC"
        run: |
          sudo mkdir -p /home/mint/.vnc
          sudo mkdir -p /tmp/runtime-mint

          sudo chown mint:mint /home/mint/.vnc
          sudo chown mint:mint /tmp/runtime-mint

          sudo chmod 700 /tmp/runtime-mint

          # VNC password = mint
          echo "mint" | sudo -u mint vncpasswd -f | \
            sudo tee /home/mint/.vnc/passwd >/dev/null

          sudo chown mint:mint /home/mint/.vnc/passwd
          sudo chmod 600 /home/mint/.vnc/passwd

          # Cinnamon startup
          cat <<'EOF' | sudo tee /home/mint/.vnc/xstartup
          #!/bin/bash

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export HOME=/home/mint
          export USER=mint
          export LOGNAME=mint
          export XDG_RUNTIME_DIR=/tmp/runtime-mint

          cd /home/mint

          exec dbus-launch --exit-with-session cinnamon-session
          EOF

          sudo chmod +x /home/mint/.vnc/xstartup
          sudo chown -R mint:mint /home/mint/.vnc

      # ============================================================
      # 🚀 START VNC
      # ============================================================
      - name: "🚀 Start VNC"
        run: |
          sudo mkdir -p /tmp/runtime-mint
          sudo chown mint:mint /tmp/runtime-mint
          sudo chmod 700 /tmp/runtime-mint

          # CRITICAL FIX:
          # Don't launch VNC from /home/runner/work/... 💀
          sudo -u mint bash -c '
            cd /home/mint

            export HOME=/home/mint
            export USER=mint
            export LOGNAME=mint
            export XDG_RUNTIME_DIR=/tmp/runtime-mint

            vncserver -kill :1 2>/dev/null || true

            vncserver :1 \
              -localhost no \
              -geometry 1280x720 \
              -depth 24
          '

          sleep 7

          echo ""
          echo "===== VNC CHECK ====="

          if sudo ss -lnt | grep -q ':5901'; then
            echo "🔥 PORT 5901 IS ALIVE"
          else
            echo "💀 VNC FAILED"
            echo ""
            echo "===== LOGS ====="
            sudo cat /home/mint/.vnc/*.log || true
            exit 1
          fi

      # ============================================================
      # 🌐 noVNC
      # ============================================================
      - name: "🌐 Start noVNC"
        run: |
          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5901 \
            >/tmp/novnc.log 2>&1 &

          sleep 5

          echo ""
          echo "===== noVNC CHECK ====="

          if sudo ss -lnt | grep -q ':6080'; then
            echo "🔥 PORT 6080 IS ALIVE"
          else
            echo "💀 noVNC FAILED"
            cat /tmp/novnc.log || true
            exit 1
          fi

          curl --fail \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "🔥 noVNC HTML WORKS"

      # ============================================================
      # ☁️ CLOUDFLARE QUICK TUNNEL
      # ============================================================
      - name: "☁️ Start Cloudflare tunnel"
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            >/tmp/cloudflare.log 2>&1 &

          echo "☁️ Waiting for public URL..."

          for i in $(seq 1 60); do

            URL=$(grep -oE \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              /tmp/cloudflare.log | head -1 || true)

            if [ -n "$URL" ]; then
              echo "$URL" >/tmp/vm-url
              break
            fi

            sleep 2
          done

          if [ ! -s /tmp/vm-url ]; then
            echo "💀 CLOUDFLARE FAILED"
            echo ""
            cat /tmp/cloudflare.log || true
            exit 1
          fi

          echo "🔥 TUNNEL CREATED"

      # ============================================================
      # 🍃 READY
      # ============================================================
      - name: "🍃 MINT IS ALIVE"
        run: |
          URL="$(cat /tmp/vm-url)"

          FINAL="${URL}/vnc.html?autoconnect=true&resize=scale"

          echo ""
          echo "============================================"
          echo "          🍃 MINT DEV VM READY"
          echo "============================================"
          echo ""
          echo "🌐 OPEN:"
          echo "$FINAL"
          echo ""
          echo "🔐 VNC password: mint"
          echo ""
          echo "👤 Linux user: mint"
          echo "🔑 Linux password: mint"
          echo ""
          echo "📂 Projects: /home/mint/Projects"
          echo ""
          echo "⚡ Fastfetch installed"
          echo "🐍 Python installed"
          echo "🟢 Node + npm installed"
          echo "🦀 Rust + Cargo installed"
          echo "☕ Java installed"
          echo "🔨 GCC / G++ / Clang / CMake installed"
          echo ""
          echo "⚠️ DO NOT CANCEL THIS ACTION"
          echo "============================================"

          # Pretty clickable link in Actions summary
          {
            echo "# 🍃 Mint Dev VM"
            echo ""
            echo "## [🔥 OPEN MINT DESKTOP]($FINAL)"
            echo ""
            echo "### Login"
            echo ""
            echo "**VNC password:** \`mint\`"
            echo ""
            echo "**Linux user:** \`mint\`"
            echo ""
            echo "**Linux password:** \`mint\`"
            echo ""
            echo "### 🧰 Dev tools"
            echo ""
            echo "\`fastfetch\` · \`git\` · \`gcc\` · \`g++\` · \`clang\`"
            echo ""
            echo "\`python3\` · \`pip\` · \`node\` · \`npm\`"
            echo ""
            echo "\`rustc\` · \`cargo\` · \`java\` · \`cmake\`"
            echo ""
            echo "⚠️ **The VM disappears when this workflow stops.**"
          } >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # 🫀 KEEP OUR ABOMINATION ALIVE
          # ========================================================

          while true; do

            if ! sudo ss -lnt | grep -q ':5901'; then
              echo ""
              echo "💀 VNC DIED"
              sudo cat /home/mint/.vnc/*.log || true
              exit 1
            fi

            if ! sudo ss -lnt | grep -q ':6080'; then
              echo ""
              echo "💀 noVNC DIED"
              cat /tmp/novnc.log || true
              exit 1
            fi

            if ! pgrep -f cloudflared >/dev/null; then
              echo ""
              echo "💀 CLOUDFLARE DIED"
              cat /tmp/cloudflare.log || true
              exit 1
            fi

            echo "🍃 VM alive — $(date)"
            sleep 30
          done
