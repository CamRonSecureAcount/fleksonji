name: "🍃 Setin's Mint DevBox"

on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 📦 DESKTOP + DEV + FLEX PACKAGES
      # ============================================================
      - name: "📦 Install the entire kitchen"
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-core \
            cinnamon-session \
            cinnamon-settings-daemon \
            muffin \
            nemo \
            gnome-terminal \
            dbus-x11 \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify \
            xterm \
            git \
            build-essential \
            gcc \
            g++ \
            clang \
            make \
            cmake \
            ninja-build \
            gdb \
            lldb \
            python3 \
            python3-pip \
            python3-venv \
            nodejs \
            npm \
            openjdk-17-jdk \
            rustc \
            cargo \
            golang-go \
            ruby \
            lua5.4 \
            sqlite3 \
            vim \
            nano \
            tmux \
            shellcheck \
            jq \
            curl \
            wget \
            zip \
            unzip \
            tree \
            htop \
            btop \
            neofetch \
            cmatrix \
            cowsay \
            figlet \
            lolcat \
            fortune-mod \
            sl

          # ========================================================
          # ⚡ FASTFETCH
          # ========================================================
          if ! sudo apt-get install -y fastfetch; then
            echo "⚡ Installing Fastfetch from official release..."

            wget -q \
              https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb \
              -O /tmp/fastfetch.deb

            sudo apt-get install -y /tmp/fastfetch.deb
          fi

          # ========================================================
          # 👤 CREATE USER
          # ========================================================
          sudo useradd -m -s /bin/bash mint 2>/dev/null || true

          echo "mint:mint" | sudo chpasswd
          sudo usermod -aG sudo mint

          sudo mkdir -p \
            /home/mint/Desktop \
            /home/mint/Downloads \
            /home/mint/Projects \
            /home/mint/.vnc

          sudo chown -R mint:mint /home/mint

          # ========================================================
          # 😎 TERMINAL FLEX
          # ========================================================
          cat <<'EOF' | sudo tee -a /home/mint/.bashrc

          clear

          echo
          echo "╔══════════════════════════════════════╗"
          echo "║       🍃 SETIN'S MINT DEVBOX        ║"
          echo "║     GitHub-powered Linux chaos      ║"
          echo "╚══════════════════════════════════════╝"
          echo

          if command -v fastfetch >/dev/null 2>&1; then
              fastfetch
          fi

          echo
          echo "🔥 DevBox armed and operational."
          echo
          EOF

          sudo chown mint:mint /home/mint/.bashrc

      # ============================================================
      # 🖥️ VNC CONFIG
      # ============================================================
      - name: "🖥️ Configure VNC + Cinnamon"
        run: |
          sudo mkdir -p /home/mint/.vnc
          sudo mkdir -p /tmp/runtime-mint

          sudo chown -R mint:mint /home/mint/.vnc
          sudo chown mint:mint /tmp/runtime-mint

          sudo chmod 700 /tmp/runtime-mint

          # VNC password: mint
          echo "mint" | sudo -u mint vncpasswd -f | \
            sudo tee /home/mint/.vnc/passwd >/dev/null

          sudo chown mint:mint /home/mint/.vnc/passwd
          sudo chmod 600 /home/mint/.vnc/passwd

          # ========================================================
          # 🍃 CINNAMON STARTUP
          #
          # Software rendering is important because GitHub's runner
          # doesn't give Cinnamon a normal desktop GPU.
          # ========================================================
          cat <<'EOF' | sudo tee /home/mint/.vnc/xstartup
          #!/bin/bash

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export HOME=/home/mint
          export USER=mint
          export LOGNAME=mint

          export XDG_RUNTIME_DIR=/tmp/runtime-mint
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=X-Cinnamon
          export DESKTOP_SESSION=cinnamon

          export GDK_BACKEND=x11

          # 🥔 GitHub GPU™
          export LIBGL_ALWAYS_SOFTWARE=1
          export CINNAMON_2D=1

          cd /home/mint

          # Try Cinnamon's 2D session first.
          if command -v cinnamon-session-cinnamon2d >/dev/null 2>&1; then
              exec dbus-launch --exit-with-session \
                cinnamon-session-cinnamon2d
          else
              exec dbus-launch --exit-with-session \
                cinnamon-session
          fi
          EOF

          sudo chmod +x /home/mint/.vnc/xstartup
          sudo chown -R mint:mint /home/mint/.vnc

      # ============================================================
      # 🚀 START TIGERVNC
      # ============================================================
      - name: "🚀 Start VNC"
        run: |
          sudo mkdir -p /tmp/runtime-mint
          sudo chown mint:mint /tmp/runtime-mint
          sudo chmod 700 /tmp/runtime-mint

          sudo -u mint bash <<'EOF'
          cd /home/mint

          export HOME=/home/mint
          export USER=mint
          export LOGNAME=mint
          export XDG_RUNTIME_DIR=/tmp/runtime-mint

          vncserver -kill :1 2>/dev/null || true

          vncserver :1 \
            -localhost no \
            -geometry 1280x720 \
            -depth 24
          EOF

          echo "⏳ Giving Cinnamon a few seconds..."
          sleep 10

          echo
          echo "====== VNC ======"

          if sudo ss -lnt | grep -q ':5901'; then
            echo "🔥 VNC IS ALIVE ON 5901"
          else
            echo "💀 VNC DIED"
            echo
            sudo cat /home/mint/.vnc/*.log || true
            exit 1
          fi

          echo
          echo "====== CINNAMON ======"

          ps aux | grep -E \
            'cinnamon|muffin|nemo' \
            | grep -v grep || true

      # ============================================================
      # 🌐 noVNC
      # ============================================================
      - name: "🌐 Start noVNC"
        run: |
          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5901 \
            >/tmp/novnc.log 2>&1 &

          sleep 4

          if ! sudo ss -lnt | grep -q ':6080'; then
            echo "💀 noVNC DIED"
            cat /tmp/novnc.log || true
            exit 1
          fi

          curl --fail \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "🔥 noVNC IS ALIVE ON 6080"

      # ============================================================
      # ☁️ CLOUDFLARE
      # ============================================================
      - name: "☁️ Open tunnel"
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            >/tmp/cloudflare.log 2>&1 &

          echo "☁️ Waiting for Cloudflare..."

          for i in $(seq 1 60); do

            URL=$(
              grep -oE \
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                /tmp/cloudflare.log \
                | head -1 || true
            )

            if [ -n "$URL" ]; then
              echo "$URL" >/tmp/vm-url
              break
            fi

            sleep 2
          done

          if [ ! -s /tmp/vm-url ]; then
            echo "💀 CLOUDFLARE DID NOT GIVE US A URL"
            cat /tmp/cloudflare.log || true
            exit 1
          fi

          echo "🔥 PUBLIC TUNNEL CREATED"

      # ============================================================
      # 😎 READY
      # ============================================================
      - name: "😎 DEVBOX READY"
        run: |
          URL="$(cat /tmp/vm-url)"

          FINAL="${URL}/vnc.html?autoconnect=true&resize=scale"

          echo
          echo "╔══════════════════════════════════════════════╗"
          echo "║          🍃 SETIN'S MINT DEVBOX             ║"
          echo "║                 IS ALIVE                    ║"
          echo "╚══════════════════════════════════════════════╝"
          echo
          echo "🌐 OPEN:"
          echo
          echo "$FINAL"
          echo
          echo "🔐 VNC password: mint"
          echo
          echo "👤 Linux user: mint"
          echo "🔑 Linux password: mint"
          echo
          echo "📂 Projects:"
          echo "   /home/mint/Projects"
          echo
          echo "⚡ FASTFETCH"
          echo "🐍 PYTHON"
          echo "🟢 NODE"
          echo "🦀 RUST"
          echo "🐹 GO"
          echo "☕ JAVA"
          echo "💎 RUBY"
          echo "🌙 LUA"
          echo "🔨 GCC / G++ / CLANG"
          echo "🧠 GDB / LLDB"
          echo "🖥️ TMUX / VIM"
          echo "📊 BTOP"
          echo "🟩 CMATRIX"
          echo
          echo "⚠️ KEEP THIS ACTION RUNNING"
          echo

          # ========================================================
          # 📋 GITHUB ACTION SUMMARY
          # ========================================================
          {
            echo "# 🍃 Setin's Mint DevBox"
            echo
            echo "## [🚀 OPEN THE DESKTOP]($FINAL)"
            echo
            echo "### 🔐 VNC"
            echo
            echo "**Password:** \`mint\`"
            echo
            echo "### 👤 Linux"
            echo
            echo "**User:** \`mint\`"
            echo
            echo "**Password:** \`mint\`"
            echo
            echo "### 🧰 Arsenal"
            echo
            echo "\`fastfetch\` · \`btop\` · \`cmatrix\` · \`tmux\`"
            echo
            echo "\`gcc\` · \`g++\` · \`clang\` · \`cmake\` · \`ninja\`"
            echo
            echo "\`python3\` · \`node\` · \`npm\`"
            echo
            echo "\`rustc\` · \`cargo\` · \`go\` · \`java\`"
            echo
            echo "\`ruby\` · \`lua\` · \`git\` · \`sqlite3\`"
            echo
            echo "⚠️ **Stopping this workflow destroys the temporary VM.**"
          } >> "$GITHUB_STEP_SUMMARY"

          # ========================================================
          # 🫀 KEEP IT ALIVE
          # ========================================================
          while true; do

            if ! sudo ss -lnt | grep -q ':5901'; then
              echo "💀 VNC DIED"
              sudo cat /home/mint/.vnc/*.log || true
              exit 1
            fi

            if ! sudo ss -lnt | grep -q ':6080'; then
              echo "💀 noVNC DIED"
              cat /tmp/novnc.log || true
              exit 1
            fi

            if ! pgrep -f cloudflared >/dev/null; then
              echo "💀 CLOUDFLARE DIED"
              cat /tmp/cloudflare.log || true
              exit 1
            fi

            echo "🍃 DevBox alive — $(date)"
            sleep 30

          done
